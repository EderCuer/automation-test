name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Executar testes E2E
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/**/*.cy.js

      - name: Salvar relatório e evidências
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-e2e
          path: cypress/reports/html/

  api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Executar testes de API
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/api/**/*.cy.js

      - name: Salvar relatório e evidências
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-api
          path: cypress/reports/html/

  publish-report:
    name: Publicar Relatório
    runs-on: ubuntu-latest
    needs: [e2e, api]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar relatório E2E
        uses: actions/download-artifact@v4
        with:
          name: relatorio-e2e
          path: relatorio/e2e

      - name: Baixar relatório API
        uses: actions/download-artifact@v4
        with:
          name: relatorio-api
          path: relatorio/api

      - name: Criar página de índice
        run: |
          cat > relatorio/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8" />
            <title>Relatório de Testes</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 60px auto; color: #333; }
              h1 { margin-bottom: 32px; }
              a { display: block; margin: 16px 0; font-size: 18px; color: #0070f3; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Relatório de Testes</h1>
            <a href="e2e/index.html">Testes E2E</a>
            <a href="api/index.html">Testes API</a>
          </body>
          </html>
          EOF

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: relatorio

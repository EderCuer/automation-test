name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Executar testes E2E
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/**/*.cy.js

      - name: Salvar relatório e evidências
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-e2e
          path: |
            cypress/reports/
            cypress/screenshots/

  api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Executar testes de API
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/api/**/*.cy.js

      - name: Salvar relatório e evidências
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-api
          path: |
            cypress/reports/
            cypress/screenshots/
